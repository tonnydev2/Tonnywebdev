<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>Scientific Calculator</title>
</head>
<body>
  <div class="container">
  <div class="display" readonly=""></div>
  <div class="buttons">
  <div class="numbers">
  <button class="number">7</button>
  <button class="number">8</button>
  <button class="number">9</button>  
  <button class="number">4</button>
  <button class="number">5</button>
  <button class="number">6</button>  
  <button class="number">1</button>
  <button class="number">2</button>
  <button class="number">3</button>
  <button class="log">log</button>
  <button class="number zero">0</button>

  <button class="log10">log<sub>10</sub></button>

    </div>
   <div class="operators">  
   <button class="clear">C</button>
  <button class="sin">sin</button>
  <button class="cos">cos</button>
  <button class="tan">tan</button>  
  <button class="number operator">➕</button>
  <button class="number operator">➖</button>
  <button class="number operator">✖️</button>
  <button class="number operator">➗</button>
  <button class="number operator helper">(</button>
  <button class="number operator helper">)</button>
  <button class="power operator helper">x<sup>y</sup></button>
  <button class="del operator helper">×</button> 
  <button class="pi">π</button>
  <button class="equals">=</button>
   </div>
    </div>
  </div>
  <script src="scripts/main.js"></script>
</body>
</html>
