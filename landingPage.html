<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonny Dev's whatsapp</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #05050a;
            /* REPLACE 'cyber-background.jpg' WITH YOUR ACTUAL IMAGE PATH */
            background-image: url('cyber-background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* Dark overlay to ensure contrast */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.6);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 720px;
            padding: 20px;
        }

        /* Frosted Glass Cyber Panel */
        .cyber-panel {
            background: rgba(10, 14, 39, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(0, 243, 255, 0.4);
            border-radius: 14px;
            padding: 40px 35px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
        }

        /* Decorative Corner Cutouts / Cyber Accents */
        .cyber-panel::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 25px;
            height: 25px;
            border-top: 3px solid #00f3ff;
            border-left: 3px solid #00f3ff;
        }

        .cyber-panel::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 25px;
            height: 25px;
            border-bottom: 3px solid #bc13fe;
            border-right: 3px solid #bc13fe;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }

        .header-subtitle {
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            color: #a0aec0;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: #00f3ff;
            letter-spacing: 1px;
            margin-bottom: 25px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        input[type="text"], textarea {
            width: 100%;
            background: rgba(5, 10, 25, 0.7);
            border: 2px solid rgba(0, 243, 255, 0.5);
            border-radius: 6px;
            padding: 14px 18px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #bc13fe;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .whatsapp-btn {
            width: 100%;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(188, 19, 254, 0.3));
            border: 2px solid #00f3ff;
            border-radius: 6px;
            padding: 16px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
            text-transform: uppercase;
            margin-top: 10px;
        }

        .whatsapp-btn:hover {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.4), rgba(188, 19, 254, 0.5));
            border-color: #bc13fe;
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.6);
            transform: translateY(-2px);
        }

        .footer-status {
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .cyber-panel {
                padding: 25px 20px;
            }
            .header-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="cyber-panel">
            
            <div class="status-bar">
                <span>System Status: Active</span>
                <span>ID: // 0x39F //</span>
            </div>

            <h1 class="header-title">TONNY DEV'S WHATSAPP</h1>
            <p class="header-subtitle">Secure Communication Channel</p>

            <form id="whatsappForm" onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label for="fullName">FULL NAME</label>
                    <input type="text" id="fullName" placeholder="ENTER YOUR IDENTITY (e.g., Kairo Chen)" required>
                </div>

                <div class="form-group">
                    <label for="reason">REASON FOR CONTACTING</label>
                    <textarea id="reason" placeholder="DESCRIBE YOUR QUERY OR PROJECT..." required></textarea>
                </div>

                <button type="submit" class="whatsapp-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                    </svg>
                    MESSAGE US // +256 758 123 943
                </button>
            </form>

            <div class="footer-status">
                <span>Location: Masaka // Uganda</span>
                <span>Secured Stream</span>
            </div>

        </div>
    </div>

    <script>
        function sendToWhatsApp(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const reason = document.getElementById('reason').value.trim();
            
            const phone = "256758123943";
            const message = `Hello! My name is ${fullName}. Reason for contacting: ${reason}`;
            
            const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
