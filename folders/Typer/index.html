<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>Tonnoid typer!</title>
</head>
<body>
  
  <div class="container">
    <h1>
    Auto-Typing Effect.
  </h1>
    <textarea class="text-holder">
    </textarea>
    <div class="controls">
      <button class="start">Start Typing</button>
      <button class="pause">Pause</button>
      <button class="reset">Reset</button>
      <button class="import">Import</button>
    <lable class="label">
      Speed:<input class="range" type="range" min="1" max="100" value="10">
      <span class="speed">Slow</span>
      <p class="feedback">Ready...</p>
    </div>
    </lable>
  </div>
  <script src="scripts/main.js"></script>
</body>
</html>
